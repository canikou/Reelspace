name: Bug report
description: Report a reproducible Reelspace problem using sanitized details.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Reelspace. Do not attach personal recordings, databases, full media paths, secrets, or unreviewed data exports.
  - type: input
    id: version
    attributes:
      label: Reelspace version
      placeholder: 0.1.1-alpha.1
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result and any safe error code shown by Reelspace.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Sanitized context
      description: Include relevant file type/size or reviewed diagnostic lines, with personal paths and identifiers removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed personal media, paths, secrets, and other private data.
          required: true
