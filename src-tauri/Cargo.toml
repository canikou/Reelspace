[package]
name = "reelspace"
version = "0.3.0-alpha.1"
description = "A local-first capture manager for raw recordings and trimmed clips."
authors = ["Reelspace"]
edition = "2021"
default-run = "reelspace"

[lib]
name = "reelspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reelspace-recorder"
path = "src/bin/reelspace-recorder.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
notify = "8"
rand = "0.9"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "query", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "1"
trash = "5"
url = "2"
walkdir = "2"
which = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
xattr = "1"

[dev-dependencies]
tempfile = "3"
